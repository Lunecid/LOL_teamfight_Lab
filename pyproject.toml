[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-teamfight-ept"
version = "0.1.0"
description = "Source-backed EPT operator for the LOL Teamfight research repository"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lol-teamfight-ept = "c_ept.s4a_operator:main"

[tool.setuptools]
py-modules = []
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["c_ept", "c_ept.*"]
exclude = ["c_ept.tests", "c_ept.tests.*"]
namespaces = false
