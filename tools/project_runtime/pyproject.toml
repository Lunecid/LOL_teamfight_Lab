[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-project-runtime"
version = "0.1.0"
description = "Shared source-backed research launcher; no scientific implementation"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["lol_project_runtime"]
namespaces = false
