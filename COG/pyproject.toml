[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-teamfight-cog"
version = "0.1.0"
description = "COG source-backed launcher; separate research sources required"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = ["lol-project-runtime==0.1.0"]

[project.scripts]
lol-teamfight-cog = "lol_teamfight_cog.cli:main"

[project.optional-dependencies]
legacy = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "lightgbm>=3.3.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
analysis = [
    "shap>=0.41.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "anthropic>=0.40.0",
]
acquisition = [
    "httpx>=0.24.0",
]
all = [
    "lol-teamfight-cog[legacy,dev,analysis,acquisition]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["lol_teamfight_cog"]
namespaces = false

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
